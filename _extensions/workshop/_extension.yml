title: Workshop Revealjs
author: Felix Dietrich
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: ../../styles/slides.scss
      logo: ../../img/transformer.png
      highlight-style: gruvbox
      transition: slide
      menu:
        side: "left"
        width: wide
        preview-links: true
        controls: true
        titleSelector: "h1, h2"
        use-text-content-for-missing-titles: false
        hideMissingTitles: true
      center: true
      history: false
      navigation-mode: "vertical"
      callout-icon: false
      include-after-body: flip-cards.html
